name: Bug 报告
description: 报告移植版 GregTech 6 的错误或异常行为（标题会自动带 [Bug] 前缀）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。提交前请先搜索[现有 issue](https://github.com/Meow404club/gregtech6/issues?q=is%3Aissue)确认没有重复。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请清楚描述遇到的问题，如有报错或崩溃请附上日志。
      placeholder: 描述问题现象、报错、崩溃日志等
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: 复现步骤
      description: 怎样一步步触发这个问题？
      placeholder: |
        1. 放置某方块
        2. 右键打开 GUI
        3. 出现异常
  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 你期望发生什么？
  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 实际发生了什么？
  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 可选。可直接把截图粘贴（Ctrl+V）到输入框，或贴 Markdown 图片链接。
  - type: dropdown
    id: environment
    attributes:
      label: 游戏环境
      description: 你在哪个版本上遇到问题？
      options:
        - 1.20.1-forge
        - 1.21.1-neoforge
        - 不确定
  - type: textarea
    id: versions
    attributes:
      label: 模组版本与其他 Mod
      description: 本模组的版本号，以及其他同时安装的 mod（如 JEI/EMI、Jade、Create 等）。
      placeholder: |
        - 本模组版本：
        - 其他 mod：
  - type: checkboxes
    id: no-duplicates
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认这是首次报告
          required: true
