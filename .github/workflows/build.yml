# GT6 现代复兴计划 CI（task p37-release-ci，规格=state:tasks.p37-release-plan ci_design 段）。
# 用户裁定「一个版本一个 worker」：双腿各占独立 runner 完全并行，每 job 恰好一次 gradle
# 调用（lesson id327 双腿禁同调用铁律）；任务表达式=stonecutter 节点直接寻址
# （settings.gradle.kts:33-43 内联块，全库零 precompute）。
# 零 secrets：submodule 公开仓（.gitmodules https URL），fork PR 只读 token 天然可跑。
# dev prerelease 裁定（task ci-dev-prerelease）：main push（非 tag）发滚动 dev prerelease——
# 先删远端 dev tag 再以 target_commitish 重建，tag 恒指本次 commit（该参数仅新建 tag 时生效）；
# prerelease 不抢 latest（softprops README 实证 "Drafts and prereleases cannot be set as latest"）；
# concurrency 组对 main push 为互斥排队（cancel-in-progress 仅 PR 真），滚动更新无竞态。
# softprops v2→v3：v2.6.2 为 v2 终版停止维护（Node 20 runtime 弃用），v3 inputs 兼容。
# 默认最小权限（S37-2 审查席建议采纳）：全 workflow 只读 token，release job 局部提权。
permissions:
  contents: read
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同 ref 重跑取消旧 run（仅 PR 抢占；tag/main push 不互踩——ref 各异）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # forge 腿：JDK 17（gradle.properties:25 矩阵注释）。root :test 不受 stonecutter 管辖，
  # 与单腿同调用合法（id327 原文，ci_design gradle_commands 定案）。
  build-forge-1-20-1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 缓存唯一入口=setup-gradle（默认缓存 ~/.gradle/caches+wrapper+build cache；
      # 官方文档警告勿叠加 setup-java cache: gradle，故 setup-java 不带 cache 项）。
      - uses: gradle/actions/setup-gradle@v4
      - name: Build forge 1.20.1
        run: |
          nproc
          ./gradlew :test :mdk:1.20.1-forge:build
      - uses: actions/upload-artifact@v4
        with:
          name: gt6-1.20.1-forge
          path: mdk/versions/1.20.1-forge/build/libs/gt6-1.20.1-forge-*.jar
          if-no-files-found: error
      # 失败时兜底传测试报告（run 35989334095：mdk:test 红但 report 未上传，名单拿不到）。
      # if-no-files-found: ignore——编译期失败时无 report，不该二次报错。
      - name: Upload forge test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-test-report
          path: |
            mdk/versions/1.20.1-forge/build/reports/tests/
            mdk/versions/1.20.1-forge/build/test-results/
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  # neoforge 腿：JDK 21（gradle.properties:26 矩阵注释）。
  # ponytail: 本 job 只显式装 21——neo 腿连带编译 root gregapi（toolchain 17，build.gradle:6-8），
  # 依赖 ubuntu-latest /usr/lib/jvm 预装 temurin 17 被 Gradle 自动探测；settings 无 foojay 供给。
  # 若 runner 镜像砍掉预装 17：setup-java 多版本 + gradle -Porg.gradle.java.installations.fromEnv。
  build-neoforge-1-21-1:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build neoforge 1.21.1
        run: |
          nproc
          ./gradlew :mdk:1.21.1-neoforge:build
      - uses: actions/upload-artifact@v4
        with:
          name: gt6-1.21.1-neoforge
          path: mdk/versions/1.21.1-neoforge/build/libs/gt6-1.21.1-neoforge-*.jar
          if-no-files-found: error
      - name: Upload neoforge test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neo-test-report
          path: |
            mdk/versions/1.21.1-neoforge/build/reports/tests/
            mdk/versions/1.21.1-neoforge/build/test-results/
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore

  # 发布 job（ci_design.release_ruling 建议案内嵌落定）：tag v* push 发正式 Release；
  # main push 发滚动 dev prerelease（语义见顶部裁定）。needs 双腿，下载双 artifact 后附到
  # Release。首版 tag v0.1.0 由主会话打，本 workflow 只接事件。
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [build-forge-1-20-1, build-neoforge-1-21-1]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gt6-1.20.1-forge
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: gt6-1.21.1-neoforge
          path: dist
      # dev 滚动更新前置：删远端旧 dev tag，保证 softprops 走 target_commitish 新建 tag、
      # tag 恒指本次 commit；|| true 容错首次运行 tag 不存在（API 422）。
      - name: Delete previous dev tag
        if: github.ref == 'refs/heads/main'
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/dev" || true
        env:
          GH_TOKEN: ${{ github.token }}
      # 正式 release：仅 tag 触发，行为与 p37-release-ci 现状一致。
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/gt6-*.jar
      # 滚动 dev prerelease：tag_name=dev 恒定，同名 jar 靠 overwrite_files（默认 true）覆盖，
      # 靠 name/body 的 sha 辨识版本。
      - name: Publish dev prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          target_commitish: ${{ github.sha }}
          name: Development build (${{ github.sha }})
          prerelease: true
          body: |
            滚动 dev 构建：每次 main push 由 CI 更新，构建自 commit ${{ github.sha }}。
            正式版见 [latest release](https://github.com/${{ github.repository }}/releases/latest)。
          files: dist/gt6-*.jar
          fail_on_unmatched_files: true
