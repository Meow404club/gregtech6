# Issue 类型自动打标：读标题前缀 [Bug]/[Feat]/[RFC]（大小写不敏感）→ 加对应小写标签。
# 无前缀的 issue 保持原样，不打任何标签；任何情况下都不会自动打 p1/p2/p3（优先级只能手动）。
# 若 GitHub Actions 额度紧张，可直接删除本文件，类型标签改手动打（每次新 issue 约消耗 1 分钟额度）。
name: Issue 类型打标
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || '';
            const m = title.match(/^\s*\[(bug|feat|rfc)\]/i);
            if (!m) {
              core.info('no [Bug]/[Feat]/[RFC] prefix, skipping');
              return;
            }
            const wanted = m[1].toLowerCase();
            // 先列可用标签，不存在则跳过（防 addLabels 对不存在的标签报错）
            const repoLabels = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (!repoLabels.data.some(l => l.name === wanted)) {
              core.info(`label "${wanted}" not found in repo, skipping`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: [wanted],
            });
            core.info(`added label "${wanted}" to issue #${context.payload.issue.number}`);
