# NeoForge 节点元数据模板（generateModMetadata 展开，产物 META-INF/neoforge.mods.toml）。
# NeoForge 1.20.5+ 元数据文件名 = neoforge.mods.toml；依赖键 mandatory=true 改 type="required"。
# loaderVersion 参照 tmp/harvest/stonecutter-template/src/main/resources/META-INF/neoforge.mods.toml
# （0.7 官方模板 1.20.5+ 线 = "[2,)"）；依赖 modId=neoforge（forge 模板为 modId=forge）。
modLoader = "javafml"
loaderVersion = "[${loader_version},)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"
