# NeoForge 节点元数据模板（generateModMetadata 展开，产物 META-INF/neoforge.mods.toml）。
# NeoForge 1.20.5+ 元数据文件名 = neoforge.mods.toml；依赖键 mandatory=true 改 type="required"。
# loaderVersion 参照 tmp/harvest/stonecutter-template/src/main/resources/META-INF/neoforge.mods.toml
# （0.7 官方模板 1.20.5+ 线 = "[2,)"）；依赖 modId=neoforge（forge 模板为 modId=forge）。
modLoader = "javafml"
loaderVersion = "[${loader_version},)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

# Jade（task p21-jade-compat）：optional 运行时兼容。NeoForge 1.20.5+ 键形 type="optional"
# （本模板 mandatory=true→type="required" 的镜像）；ordering=NONE/side=BOTH 照抄 GTCEu Modern。
# 声明偏离 GTCEu：versionRange 硬编码 [15,) 不走 jade_version 属性插值（generateModMetadata
# 对注释内占位符也会展开，见 p21 冒烟实证）——钉值带 +neoforge 后缀进 TOML Maven 区间
# 是未测边界；15 = Jade 1.21.1 NeoForge 大线地板。
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[15,)"
ordering = "NONE"
side = "BOTH"
