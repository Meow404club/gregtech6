# 1.20.1 Forge 节点参数。
# 加载机制（2026-09-03 scratch 实证）：vanilla Gradle 的 Project.property() 会读
# 子项目自身目录的 gradle.properties（providers.gradleProperty 不读；向上可及父项目目录）。
# stonecutter 节点 projectDir = mdk/versions/<node>（TreeBuilderImpl.createNode），
# 故本文件的 deps.* 对节点 buildscript（mdk/build.forge.gradle.kts）直接可见。
# mod.* 元数据放控制器目录 mdk/gradle.properties（父项目目录，节点向上可读，零重复）。
deps.minecraft=1.20.1
deps.forge=47.4.10
# ---- kjs 三件钉值（task p34-kjs-bindings）----
# 与 GTCEu 1.20.1 gradle/forge.versions.toml:11-13 同钉（kubejs 2001.6.5-build.16 /
# rhino-forge 2001.2.3-build.10 / architectury-forge 9.2.14）——本卡 kjs 集成包以
# GTCEu 同包集成与 KubeJS 2001 分支源为编译参考，同 build 是零漂移选择。
# 留空（键后无值）= 无 kjs 构建态：build.forge.gradle.kts 依赖段整体跳过 +
# mdk/stonecutter.gradle.kts 的 kjs 常量 false → gregtech6.integration.kjs 包编译为空。
# 这是 runtime-optional 零传染（不 jarJar 不 modApi）双态验证的唯一开关。
kubejs_version=2001.6.5-build.16
rhino_version=2001.2.3-build.10
architectury_version=9.2.14
