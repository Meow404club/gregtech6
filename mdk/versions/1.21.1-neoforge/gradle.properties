# 1.21.1 NeoForge 节点参数（加载机制见 ../1.20.1-forge/gradle.properties 注释）。
# deps.neoforge = 21.1 线最新稳定（maven.neoforged.net releases，2026-09-03 查证：21.1.249）。
# deps.fml = javafml 语言加载器版本（mods.toml loaderVersion "[2,)"，0.7 官方模板 1.20.5+ 线钉值）。
# deps.neoforge_range = mods.toml 依赖 versionRange（neoforge 21 大线）。
deps.minecraft=1.21.1
deps.neoforge=21.1.249
deps.fml=2
deps.neoforge_range=[21,)
# jei_version = JEI 1.21.1 19.x 线钉值（task p15-jei-dual-wiring）。19.52.0.422 = blamejared
# maven-metadata <latest>（2026-09-03）+ Modrinth "19.52.0.422 for NeoForge 1.21.1"（2026-09-03）
# 双源一致；降级预案 19.51.0.418（Modrinth 最新 release 标记位）。同名键遮蔽根 gradle.properties
# 的 1.20.1 钉值（15.56.0.205）——遮蔽行为实证见 build.neoforge.gradle.kts JEI 段注释。
jei_version=19.52.0.422
# jade_version = Jade 1.21.1 NeoForge 15.10.6 线钉值（task p21-jade-compat）。Modrinth maven
# maven-metadata + GitHub tag neoforge-15.10.6 双源一致（2026-09-07）。同名键遮蔽根
# gradle.properties 的 1.20.1 钉值（11.13.3+forge）——遮蔽行为同上方 jei_version 先例。
jade_version=15.10.6+neoforge
# ---- kjs 两件钉值（task p34-kjs-bindings）----
# 与 GTCEu 1.21 gradle/forge.versions.toml:8-9 同钉（kubejs-neoforge 2101.7.2-build.336 /
# rhino 2101.2.7-build.81）；7.x bundle 不含 architectury（GTCEu 1.21 toml:131 同口径）。
# 留空 = 无 kjs 构建态（机制见 ../1.20.1-forge/gradle.properties 同段注释）。
kubejs_version=2101.7.2-build.336
rhino_version=2101.2.7-build.81
