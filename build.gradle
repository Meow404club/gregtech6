plugins {
    id 'java-library'
}

group = 'gregtech6'
version = '1.0.0-SNAPSHOT'

description = 'GT6 Modern Revival - Phase 1: pure-Java material system foundation (no Minecraft dependencies)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
    // JVM 级并行：每 fork 独立 JVM，fork 内测试仍串行，类内语义零变化。
    // 核数×2：test fork 大头是类加载/静态 init 这类不满核计算，CI 4 vCPU → 6 fork 已让核饱和
    // （availableProcessors 运行时自适应；超订填缝收益 8→6 损失很小）。
    // cap 6 内存账（实测版，按最重的 mdk fork 记账）：mdk 单 fork RSS≈2.3GB@2g 堆（含
    // metaspace/native）→ mdk 堆降 1536m 后估 ~1.9GB/fork，6×1.9+daemon ~1.5 ≈ 12.9GB
    // ≤ 16GB runner 可用 ~13.5GB（OS+agent 占 ~1.5-2GB）；8×2.3=18.4GB、7×2.3=16.1GB、
    // 6×2.3=15.3GB@2g 堆均超可用——确定性 OOM，故 cap 6 且 mdk 降堆。
    // ②本地 12 核裸公式=24 forks 超物理内存+gt6testgate 30G 闸，cap 6 同护本地。
    // 402 个测试文件已扫描：零 ServerSocket/零文件写（2026-09-25 主会话 grep 实证），fork 间无文件域冲突。
    // 本任务在 CI 上 FROM-CACHE 不受影响，本地门禁受益。
    maxParallelForks = Math.min(Runtime.getRuntime().availableProcessors() * 2, 6)
}
