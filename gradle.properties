# daemon 堆 1g→2g（M1 裁决 decisions.2026-09-03-p15-m1-gate）：1.21.1 全量诊断收集
# （maxerrs=100000 协议，2652 错误面）经 Gradle 消息枢纽回传时 1g daemon 会 OOM
# （W1 机制实证六条之一，tmp.poc.p15-skeleton）。改动自动触发 daemon 换代重启。
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true

